services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-your_gemini_api_key_here}
      - DATABASE_URL=sqlite+aiosqlite:///./argus.db
      - DEMO_MODE=${DEMO_MODE:-true}
      - CORS_ORIGINS=http://localhost:3000,http://localhost:5173
      - AUDIT_LOG_PATH=/app/data/audit.log
      - USE_LOBSTER_TRAP_BINARY=true
      - LOBSTER_TRAP_POLICY_PATH=/app/configs/lobstertrap_policy.yaml
    volumes:
      - argus_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: ./argus-dashboard
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8000
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  argus_data:
