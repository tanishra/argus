version: "1.0"
name: argus-finance-pci-policy
description: "PCI-DSS / SOC2 Compliant authorization policy for ARGUS"

ingress_rules:
  - name: pci_data_exfiltration
    description: "Deny any PAN or financial data transfer to unauthorized external endpoints"
    priority: 1
    conditions:
      - field: detected.pci_detected
        operator: equals
        value: true
      - field: detected.target_type
        operator: equals
        value: external
    action: DENY

  - name: swift_transaction_review
    description: "Quarantine any high-value money movement for human review"
    priority: 2
    conditions:
      - field: detected.action_type
        operator: in
        value: ["initiate_transfer", "approve_wire"]
      - field: detected.transaction_amount
        operator: greater_than
        value: 10000
    action: QUARANTINE

  - name: default_allow
    description: "Allow low-risk aligned actions"
    priority: 100
    conditions:
      - field: risk_score
        operator: less_than
        value: 0.3
    action: ALLOW
