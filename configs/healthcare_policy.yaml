version: "1.0"
name: argus-healthcare-policy
description: "ARGUS HIPAA-compliant healthcare policy for clinical AI agents"

# ============================================================
# PRIMARY DEMO POLICY — Clinical Discharge Agent Scenario
# ============================================================
# This policy governs AI agents operating in clinical settings.
# All rules are HIPAA-aligned and designed to prevent:
#   - Unauthorized PHI access
#   - Patient data exfiltration
#   - Unsafe clinical workflow execution
# ============================================================

ingress_rules:
  # --- CRITICAL: PHI Exfiltration Prevention ---

  - name: phi_exfiltration_block
    description: "DENY any attempt to export PHI to external domains"
    priority: 1
    conditions:
      - field: detected.action_type
        operator: in
        value: ["export_phi", "forward_phi_external", "bulk_export_records"]
      - field: detected.target_type
        operator: equals
        value: external
    action: DENY

  - name: phi_domain_block
    description: "Strict block on any PHI leaving the system to unauthorized domains"
    priority: 1
    conditions:
      - field: detected.phi_detected
        operator: equals
        value: true
      - field: detected.target_domain
        operator: not_in
        value: ["secure.hospital.org", "internal.emr.local", "hospital.org", "clinic.internal", "ehr.internal"]
    action: DENY

  - name: intent_mismatch_phi
    description: "QUARANTINE when declared intent is clinical but detected action is data exfiltration"
    priority: 2
    conditions:
      - field: declared.intent
        operator: in
        value: ["clinical_discharge", "patient_record_access", "healthcare_record_management"]
      - field: detected.intent_category
        operator: equals
        value: data_exfiltration
    action: QUARANTINE

  - name: external_phi_forward
    description: "DENY patient data forwarding to any external domain"
    priority: 3
    conditions:
      - field: detected.action_type
        operator: in
        value: ["forward_email", "send_email", "forward_phi_external"]
      - field: detected.target_domains
        operator: not_in
        value: ["secure.hospital.org", "internal.emr.local", "hospital.org", "clinic.internal", "ehr.internal"]
      - field: detected.phi_detected
        operator: equals
        value: true
    action: DENY

  # --- Patient Record Access Controls ---

  - name: unauthorized_record_access
    description: "Block patient record access without declared clinical intent"
    priority: 4
    conditions:
      - field: detected.action_type
        operator: in
        value: ["read_patient_record", "access_medication_records"]
      - field: declared.intent
        operator: not_in
        value: ["clinical_discharge", "patient_record_access", "healthcare_record_management", "clinical_review"]
    action: DENY

  - name: sensitive_record_access
    description: "Quarantine access to VIP or highly sensitive patient records"
    priority: 4
    conditions:
      - field: detected.target_sensitivity
        operator: equals
        value: HIGH
      - field: risk_score
        operator: greater_than
        value: 0.4
    action: HUMAN_REVIEW

  - name: out_of_scope_patient_access
    description: "Deny access to records outside declared patient scope"
    priority: 5
    conditions:
      - field: detected.target
        operator: outside_scope
        value: declared.scope
      - field: detected.action_type
        operator: in
        value: ["read_patient_record", "update_ehr", "generate_discharge_summary"]
    action: QUARANTINE

  # --- Bulk Operations ---

  - name: bulk_record_operations
    description: "Quarantine bulk record operations for human review"
    priority: 6
    conditions:
      - field: detected.action_type
        operator: in
        value: ["bulk_export_records", "delete_patient_record"]
    action: HUMAN_REVIEW

  # --- Medication Safety ---

  - name: medication_actions_review
    description: "Require human approval for any medication-related actions"
    priority: 7
    conditions:
      - field: detected.action_type
        operator: equals
        value: access_medication_records
      - field: detected.parameters.modification
        operator: equals
        value: true
    action: HUMAN_REVIEW

  # --- Injection Detection ---

  - name: injection_in_clinical_data
    description: "Quarantine any action with detected prompt injection patterns"
    priority: 8
    conditions:
      - field: detected.injection_patterns
        operator: not_empty
    action: QUARANTINE

  # --- High Risk Threshold ---

  - name: high_risk_clinical_action
    description: "Quarantine high-risk actions for review"
    priority: 10
    conditions:
      - field: risk_score
        operator: greater_than
        value: 0.7
    action: HUMAN_REVIEW

  # --- Safe Operations ---

  - name: allow_read_within_scope
    description: "Allow read-only operations within declared scope"
    priority: 50
    conditions:
      - field: detected.action_type
        operator: in
        value: ["read_patient_record", "generate_discharge_summary"]
      - field: risk_score
        operator: less_than
        value: 0.3
    action: ALLOW

  - name: allow_ehr_update_within_scope
    description: "Allow EHR updates within declared scope with low risk"
    priority: 51
    conditions:
      - field: detected.action_type
        operator: equals
        value: update_ehr
      - field: risk_score
        operator: less_than
        value: 0.4
    action: LOG_AND_ALLOW

  - name: default_allow
    description: "Allow low-risk aligned actions"
    priority: 100
    conditions:
      - field: risk_score
        operator: less_than
        value: 0.2
    action: ALLOW

# ============================================================
# Global Healthcare Baseline Policies (always enforced)
# These CANNOT be overridden by any user intent
# ============================================================
baseline_policies:
  - "Never export PHI to external domains"
  - "Never bulk delete patient records"
  - "Never forward clinical data outside the organization"
  - "Patient data access requires declared clinical intent"
  - "Medical records require elevated authorization level"
  - "Medication modifications require human approval"
  - "All PHI access must be logged to immutable audit trail"
